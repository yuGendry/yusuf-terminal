<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>STITCHWORK</title>
<meta name="description" content="A first-person horror puzzle game set in the abandoned Hollowhart Puppet Works." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0908'/%3E%3Cellipse cx='16' cy='15' rx='9' ry='11' fill='%23e8e0d2'/%3E%3Cellipse cx='12.5' cy='13' rx='2' ry='2.6' fill='%230a0908'/%3E%3Cellipse cx='19.5' cy='13' rx='2' ry='2.6' fill='%230a0908'/%3E%3Cpath d='M11 21 q5 3 10 0' stroke='%237e1f1c' stroke-width='1.4' fill='none'/%3E%3Cpath d='M16 4 v22' stroke='%237e1f1c' stroke-width='0.6' opacity='0.5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Special+Elite&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="viewport"></canvas>

  <!-- Screen-space overlays owned by the game (HUD, mask frame, subtitles) -->
  <div id="game-layer" class="layer" aria-hidden="true"></div>

  <!-- Menus, settings, pause, archive -->
  <div id="ui-layer" class="layer"></div>

  <!-- Full-screen grain/scanline treatment for menus -->
  <div id="static-overlay"></div>

  <div id="boot">
    <div id="boot-inner">
      <div id="boot-title">HOLLOWHART</div>
      <div id="boot-bar"><i></i></div>
      <div id="boot-status">threading&hellip;</div>
    </div>
  </div>

  <noscript>
    <div class="noscript">STITCHWORK requires JavaScript and a WebGL2-capable browser.</div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
