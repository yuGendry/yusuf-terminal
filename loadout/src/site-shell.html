<style>
  .auth-btn { height: 42px; }
  .auth-avatar { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--accent); color: var(--accent-ink); font: 700 16px var(--body); display: grid; place-items: center; overflow: hidden; padding: 0; }
  .auth-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .acct-wrap { position: relative; }
  .acct-menu { position: absolute; right: 0; top: 50px; z-index: 9; min-width: 240px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; display: grid; gap: 2px; }
  .acct-menu button { border: 0; background: none; text-align: left; padding: 9px 10px; border-radius: 9px; font-weight: 600; }
  .acct-menu button:hover { background: var(--surface-2); }
  .acct-head { display: grid; gap: 4px; padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; font-size: 13px; color: var(--ink-2); }
  .acct-head b { color: var(--ink); font-size: 14.5px; }
  .acct-head .status-tag { justify-self: start; }
  .modal { position: fixed; inset: 0; z-index: 30; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
  .modal-card { position: relative; width: min(420px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 28px 24px 22px; display: grid; gap: 12px; }
  .modal-card h2 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; margin: 0; }
  .modal-card .d-close { background: var(--surface-2); color: var(--ink); top: 12px; }
  .google { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); width: 100%; padding: 12px; }
  .google:hover { border-color: var(--ink-3); }
  .or { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; color: var(--ink-3); font-size: 13px; }
  .or::before, .or::after { content: ""; height: 1px; background: var(--line); }
  #auth-form { display: grid; gap: 8px; }
  #auth-form label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  #auth-form input { height: 44px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--bg); padding: 0 12px; font-size: 15px; }
  #auth-form input:focus { outline: none; border-color: var(--accent); }
  #auth-form .btn { margin-top: 6px; padding: 12px; }
  .auth-err { margin: 0; min-height: 1em; color: var(--bad); font-size: 13.5px; font-weight: 600; }
  .auth-links { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13.5px; }
  body.modal-open { overflow: hidden; }
  .gift-link { justify-self: start; }
</style>
<div class="modal" id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title" hidden>
  <div class="modal-card">
    <button type="button" class="d-close" id="auth-close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>
    <h2 id="auth-title">Sign in to Loadout</h2>
    <p class="tiny" id="auth-sub" style="margin:0">Sign in to sync your library and manage Loadout Pro.</p>
    <button type="button" class="btn google" id="auth-google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"></path><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.4 0 20.1 0 24s1 7.6 2.6 10.8l7.9-6.2z"></path><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6.2C6.6 42.6 14.6 48 24 48z"></path></svg>
      Continue with Google
    </button>
    <div class="or">or</div>
    <form id="auth-form" novalidate>
      <label for="auth-email">Email</label>
      <input id="auth-email" type="email" autocomplete="email" inputmode="email" required>
      <label for="auth-pass">Password</label>
      <input id="auth-pass" type="password" autocomplete="current-password" minlength="6" required>
      <p class="auth-err" id="auth-err" role="alert"></p>
      <button type="submit" class="btn" id="auth-submit">Sign in</button>
    </form>
    <div class="auth-links">
      <button type="button" class="linkbtn" id="auth-toggle">New here? Create an account</button>
      <button type="button" class="linkbtn" id="auth-forgot">Forgot password?</button>
    </div>
    <p class="tiny" style="margin:0">By continuing you agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</p>
  </div>
</div>
